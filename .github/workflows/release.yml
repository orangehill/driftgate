name: release

# A release is made only from a tag vX.Y.Z (a tag with a suffix, such as
# v1.1.0-rc.1, is a prerelease). By hand (workflow_dispatch) the workflow
# runs dry by default: it checks, builds, verifies the rebuild and signs, but
# publishes nothing; the signed files stay as a workflow artifact. A run by
# hand with dry-run off publishes only when it is started on a tag (to finish
# a release whose tag run failed); on a branch it never publishes.
#
# Jobs: check (ci.yml itself) and on-main (the tag is a commit of main) →
# build (six platforms, built twice, SBOMs, SHA256SUMS) → sign (cosign
# keyless over SHA256SUMS, build provenance) → publish (in the release
# environment: a draft release with every file, then made public).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and sign, but publish nothing (off publishes only when run on a tag)
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Whether this run publishes: a tag push, or a run by hand on a tag with
  # dry-run off.
  PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false) }}

# Two runs for the same tag never race to the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks of ci.yml itself (one definition): format, vet, staticcheck,
  # tests, fuzzing, govulncheck, the size report and the package gate on the six
  # platforms. MariaDB's userstat stays off here, so its fallback path is
  # tested too.
  check:
    uses: ./.github/workflows/ci.yml
    with:
      mariadb-userstat: "off"

  # A tag publishes only a commit that is on main: a tag pushed on any other
  # commit (a branch, a pull request's head) stops here.
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0 # every branch, origin/main included
      - name: Tagged commit is on main
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "not a tag: nothing to publish, nothing to check"
            exit 0
          fi
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$REF_NAME ($commit) is not on main; tag a commit of main"
            exit 1
          fi
          echo "$REF_NAME ($commit) is on main"

  # Every binary is built twice, the second time from another checkout
  # directory with an empty build cache; the release stops unless both builds
  # are byte for byte the same. The build date is the commit time, so anyone
  # can rebuild the tag and get the same bytes (docs/security.md).
  build:
    needs: [check, on-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # A release build does not start from a cache that other runs wrote.
          cache: false
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          commit="$(git rev-parse HEAD)"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; else version="dev-${commit:0:12}"; fi
          date="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "date=$date"
          } >>"$GITHUB_OUTPUT"
          echo "driftgate $version (commit $commit, built $date)"
      - name: Build twice and compare
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
          CGO_ENABLED: "0"
        run: |
          pkg=github.com/orangehill/driftgate/internal/cli
          ldflags="-s -w -X $pkg.Version=$VERSION -X $pkg.Commit=$COMMIT -X $pkg.Date=$DATE"
          rebuild="$RUNNER_TEMP/rebuild"
          git worktree add --detach "$rebuild" HEAD
          mkdir -p dist "$RUNNER_TEMP/dist2"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [ "$os" = windows ] && ext=.exe
            name="driftgate-$os-$arch$ext"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ldflags" -o "dist/$name" ./cmd/driftgate
            (cd "$rebuild" && GOCACHE="$RUNNER_TEMP/gocache2" GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "$ldflags" -o "$RUNNER_TEMP/dist2/$name" ./cmd/driftgate)
            a="$(sha256sum "dist/$name" | cut -d' ' -f1)"
            b="$(sha256sum "$RUNNER_TEMP/dist2/$name" | cut -d' ' -f1)"
            if [ "$a" != "$b" ]; then
              echo "::error::$name is not reproducible: $a and $b"
              exit 1
            fi
            echo "$name $a (rebuilt identically)"
          done
          ./dist/driftgate-linux-amd64 version
      - name: SBOMs
        env:
          CGO_ENABLED: "0"
        run: |
          # CycloneDX, one per binary: build constraints change which modules
          # are in it. No serial number and no timestamp, so the SBOM is as
          # reproducible as the binary. The tool is built for the runner
          # first; GOOS and GOARCH then only describe the target.
          GOBIN="$RUNNER_TEMP/bin" go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            GOOS=$os GOARCH=$arch "$RUNNER_TEMP/bin/cyclonedx-gomod" app \
              -json -std -licenses -noserial -notimestamp -main cmd/driftgate \
              -output "dist/driftgate-$os-$arch.cdx.json" .
          done
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum driftgate-* >SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Keyless signing: the certificate names this workflow and the tag
  # (https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/vX.Y.Z),
  # issued for the job's GitHub OIDC token. SHA256SUMS covers every binary
  # and SBOM, so one signature covers the release.
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Verify the checksums
        working-directory: dist
        run: sha256sum -c --strict SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          # The same check a user makes (docs/security.md).
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      # SLSA build provenance for every file in SHA256SUMS (gh attestation
      # verify). Artifact attestations need a public repository (or GitHub
      # Enterprise Cloud), so a private repository skips them; a dry run
      # never records one.
      - name: Build provenance
        if: env.PUBLISH == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed
          path: dist/
          if-no-files-found: error

  # The release is made as a draft, gets every file, and only then becomes
  # public: nobody downloads a release that is missing its signature.
  # The release environment: required reviewers or a wait can be added to it
  # in the repository settings (Environments) without changing this file.
  publish:
    needs: sign
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.dry-run == false)
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed
          path: dist
      - name: Verify the checksums
        working-directory: dist
        run: |
          sha256sum -c --strict SHA256SUMS
          test -s SHA256SUMS.sigstore.json
      - name: Publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes ${pre[@]+"${pre[@]}"} \
            driftgate-* SHA256SUMS SHA256SUMS.sigstore.json
          gh release edit "$TAG" --draft=false
