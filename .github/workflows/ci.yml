name: ci

# Changes to documents alone run only docs.yml (the docs test, no database).
# Branches are checked with the local tests; CI runs on main and development,
# on pull requests and by hand. The release workflow runs these same jobs
# (workflow_call), so a release passes exactly the checks of CI. The CI badge
# in README.md shows this workflow on main.
on:
  push:
    branches: [main, development]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  # Nightly on main: the database images of the databases job move on
  # (patch releases) without a push here.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      mariadb-userstat:
        description: on turns on MariaDB's per-table counters; off tests the fallback without them
        type: string
        default: "on"

permissions:
  contents: read

# A newer push to the same branch cancels the run still going. Called by the
# release workflow, github.workflow is "release": its checks never cancel a
# CI run of the same branch, nor share the release's own group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# How long one test package may run before go test stops it (go's default
# is 10m). The slowest packages (internal/data, internal/state with SQL
# Server) take 5-9 minutes on a normal runner; a slower runner must not fail
# a sound build. Each job's timeout-minutes is the outer bound: a job that
# hangs is stopped there, whatever this value is.
env:
  GO_TEST_TIMEOUT: 20m

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: dg
        ports: ["33071:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dg
        ports: ["33081:3306"]
        options: --health-cmd="mysqladmin ping -pdg" --health-interval=5s --health-retries=20
      # The state tests check that nothing was written between two
      # fingerprints: they get servers no other test writes to.
      mariadb-state:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: dg
        ports: ["33072:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
      mysql-state:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dg
        ports: ["33082:3306"]
        options: --health-cmd="mysqladmin ping -pdg" --health-interval=5s --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dg
        ports: ["54371:5432"]
        options: --health-cmd=pg_isready --health-interval=5s --health-retries=20
    env:
      DRIFTGATE_TEST_MYSQL: mysql://root:dg@127.0.0.1:33071/,mysql://root:dg@127.0.0.1:33081/
      DRIFTGATE_TEST_MYSQL_STATE: mysql://root:dg@127.0.0.1:33072/,mysql://root:dg@127.0.0.1:33082/
      DRIFTGATE_TEST_POSTGRES: postgres://postgres:dg@127.0.0.1:54371/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Service containers take no command line: MariaDB's per-table counters
      # (userstat) are turned on here. The tests also run without them (the
      # release runs them so, to test the fallback path).
      - name: MariaDB userstat
        if: inputs.mariadb-userstat != 'off'
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -pdg -e "SET GLOBAL userstat = 1"
          docker exec ${{ job.services.mariadb-state.id }} mariadb -uroot -pdg -e "SET GLOBAL userstat = 1"
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      # The SQLite and SQL Server drivers are imported by internal/state
      # alone (its tests included): every other package reaches a database
      # through a state component.
      - name: Driver imports
        shell: bash
        run: |
          go list -test -f '{{.ImportPath}} {{join .Imports " "}}' ./... \
            | awk '$1 !~ /^github\.com\/orangehill\/driftgate\/internal\/state(_test)?$/ {
                     for (i = 2; i <= NF; i++) if ($i ~ /^(modernc\.org\/sqlite|github\.com\/microsoft\/go-mssqldb)(\/|$)/) { print $1 ": " $i; bad = 1 } }
                   END { exit bad }'
      # Coverage of the whole module (-coverpkg), with the databases of this
      # job; the report goes to Coveralls on pushes, never failing the job.
      # The SQLite end-to-end and crash tests run in the sqlite job, without
      # the race detector: under it, SQLite (C translated to Go) in every
      # driftgate process they start takes them from 5 s to 100 s. The
      # SQLite tests of the packages run here with it.
      - name: Test
        run: go test -race -timeout "$GO_TEST_TIMEOUT" -covermode=atomic -coverpkg=./... -coverprofile=coverage.out -skip '^Test(EndToEnd|Crash\w*)SQLite$' ./...
      - name: Coverage report
        if: github.event_name == 'push' && github.workflow == 'ci'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.out
          format: golang
          fail-on-error: false
      # Allocations of the comparison's hot paths, against budgets: the
      # same on every run, unlike timings on a shared runner. The race
      # detector allocates on its own, so they run without it.
      - name: Allocation budgets
        run: go test -count=1 -run=Budget ./internal/compare/ ./internal/jsonx/
      - name: Fuzz the JSON parser
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=60s ./internal/jsonx/
      - name: Fuzz the dump reader of data verify
        run: go test -run='^$' -fuzz=FuzzStatements -fuzztime=60s ./internal/data/
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Database versions users run besides the ones of test: MariaDB 10.3
  # (oldest supported; its query cache and plans differ), 10.6,
  # MySQL 8.0, PostgreSQL 13 and 16; and the end-to-end and whole crash
  # matrix (tools/e2e) on the versions of test. The state, data, capture
  # and command tests on each, without -race (test has it). Not for pull
  # requests: four more database stacks for every push of a branch; on
  # main and development, nightly and by hand they catch what a version
  # does differently before a release (which runs them too).
  databases:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "MariaDB 10.3, PostgreSQL 13", mysql: "mariadb:10.3", postgres: "postgres:13", packages: "./internal/state/ ./internal/data/ ./internal/capture/ ./internal/cli/ ./internal/dbx/ ./tools/e2e/"}
          - {name: "MariaDB 10.6, PostgreSQL 16", mysql: "mariadb:10.6", postgres: "postgres:16", packages: "./internal/state/ ./internal/data/ ./internal/capture/ ./internal/cli/ ./internal/dbx/ ./tools/e2e/"}
          - {name: "MySQL 8.0", mysql: "mysql:8.0", postgres: "postgres:17", packages: "./internal/state/ ./internal/data/ ./internal/capture/ ./internal/cli/ ./internal/dbx/ ./tools/e2e/"}
          - {name: "end to end, MariaDB 11.4, PostgreSQL 17", mysql: "mariadb:11.4", postgres: "postgres:17", packages: "./tools/e2e/"}
    name: databases (${{ matrix.name }})
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MARIADB_ROOT_PASSWORD: dg
          MYSQL_ROOT_PASSWORD: dg
        ports: ["33071:3306"]
      mysql-state:
        image: ${{ matrix.mysql }}
        env:
          MARIADB_ROOT_PASSWORD: dg
          MYSQL_ROOT_PASSWORD: dg
        ports: ["33072:3306"]
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: dg
        ports: ["54371:5432"]
        options: --health-cmd=pg_isready --health-interval=5s --health-retries=20
    env:
      DRIFTGATE_TEST_MYSQL: mysql://root:dg@127.0.0.1:33071/
      DRIFTGATE_TEST_MYSQL_STATE: mysql://root:dg@127.0.0.1:33072/
      DRIFTGATE_TEST_POSTGRES: postgres://postgres:dg@127.0.0.1:54371/postgres
      DRIFTGATE_E2E: "1"
      DRIFTGATE_CHAOS: full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The images differ in their client's name and health check: ready is
      # a query over TCP (the first start of an image serves only a socket).
      - name: Wait for the databases
        env:
          USERSTAT: ${{ inputs.mariadb-userstat != 'off' && 'SET GLOBAL userstat = 1' || 'SELECT 1' }}
        run: |
          for id in ${{ job.services.mysql.id }} ${{ job.services.mysql-state.id }}; do
            for i in $(seq 90); do
              docker exec $id sh -c 'for c in mariadb mysql; do command -v $c >/dev/null && exec $c -h127.0.0.1 -uroot -pdg -e "SELECT 1"; done' >/dev/null 2>&1 && break
              sleep 2
            done
            # MariaDB's userstat as in the job above: off when the caller
            # (release) tests the fallback without it.
            docker exec -e USERSTAT="$USERSTAT" $id sh -c 'for c in mariadb mysql; do command -v $c >/dev/null && exec $c -h127.0.0.1 -uroot -pdg -e "SELECT VERSION(); $USERSTAT" ; done' 2>/dev/null || true
          done
      - name: Test
        run: go test -count=1 ${{ matrix.packages }}

  # SQLite: the driver's tests on the three systems the binary runs on, as
  # SQLite's file locking differs between them; the database is a file, so
  # no service is needed. Also for pull requests. Python's own SQLite is the
  # application in another process (DRIFTGATE_TEST_PYTHON: its tests fail
  # rather than skip without it). The end-to-end and crash tests (kill -9
  # inside a restore and a seed) need a unix; the fuzzer runs on Linux.
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: sqlite (${{ matrix.os }})
    env:
      DRIFTGATE_TEST_PYTHON: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Test
        shell: bash
        run: go test -count=1 -run SQLite ./internal/state/ ./internal/capture/ ./internal/cli/ ./internal/appconf/ ./internal/config/ ./internal/dbdsn/
      - name: End to end and crashes
        if: runner.os != 'Windows'
        run: go test -count=1 -run SQLite ./tools/e2e/
      - name: Fuzz the SQLite restore
        if: runner.os == 'Linux'
        run: go test -run='^$' -fuzz=FuzzSQLiteRestore -fuzztime=60s ./internal/state/

  # SQL Server: the driver's tests against SQL Server 2022 (Developer), also
  # for pull requests, with the race detector; the end-to-end and crash
  # tests (the whole matrix outside pull requests), the restore fuzzer, and
  # the TLS check against a server with a certificate of its own (a second
  # container the script starts). The image starts slowly; the health check
  # waits for it.
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Dg-Passw0rd-2026
        ports: ["14331:1433"]
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dg-Passw0rd-2026 -Q 'SELECT 1' -b"
          --health-interval=5s --health-retries=30
    env:
      DRIFTGATE_TEST_SQLSERVER: sqlserver://sa:Dg-Passw0rd-2026@127.0.0.1:14331?encrypt=true&TrustServerCertificate=true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -count=1 -timeout "$GO_TEST_TIMEOUT" -run SQLServer ./internal/state/ ./internal/capture/ ./internal/cli/ ./internal/appconf/ ./internal/dbdsn/ ./internal/config/
      # Every driftgate process the tests start would run under the race
      # detector too; they run without it, as in the sqlite job.
      - name: End to end and crashes
        env:
          DRIFTGATE_CHAOS: ${{ github.event_name != 'pull_request' && 'full' || '' }}
        run: go test -count=1 -run SQLServer ./tools/e2e/
      - name: Fuzz the SQL Server restore
        run: go test -run='^$' -fuzz=FuzzSQLServerRestore -fuzztime=60s ./internal/state/
      - name: TLS
        run: tools/e2e/sqlserver-tls.sh

  # SQL Server 2017, 2019 and 2025, as the databases job does for MySQL and
  # PostgreSQL: not for pull requests. 2017 is the oldest DriftGate
  # supports. sqlcmd moved to mssql-tools18 in the newer images (2017 has
  # only /opt/mssql-tools); the health check and sqlserver-tls.sh take
  # either.
  sqlserver-versions:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version: ["2017-latest", "2019-latest", "2025-latest"]
    name: sqlserver (${{ matrix.version }})
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.version }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Dg-Passw0rd-2026
        ports: ["14331:1433"]
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dg-Passw0rd-2026 -Q 'SELECT 1' -b || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Dg-Passw0rd-2026 -Q 'SELECT 1' -b"
          --health-interval=5s --health-retries=30
    env:
      DRIFTGATE_TEST_SQLSERVER: sqlserver://sa:Dg-Passw0rd-2026@127.0.0.1:14331?encrypt=true&TrustServerCertificate=true
      DRIFTGATE_CHAOS: full
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # One package at a time (-p 1). On SQL Server 2017 and 2019 a
      # statement fails while another database of the server changes, and
      # the state tests keep other databases changing or restoring on
      # purpose (TestSQLServerOtherDatabaseRestoring) for a minute and
      # more: the packages run alongside them could not tell that from a
      # failure of their own. The state tests cover the retries.
      - name: Test
        run: go test -p 1 -count=1 -timeout "$GO_TEST_TIMEOUT" -run SQLServer ./internal/state/ ./internal/capture/ ./internal/cli/ ./tools/e2e/
      - name: TLS
        env:
          IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.version }}
        run: tools/e2e/sqlserver-tls.sh

  # Windows: the packages that need no database, and the parts written for
  # it (the store lock, process groups). A cross-compiled build (build)
  # does not run a test.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: |
          go test -count=1 ./internal/storelock/ ./internal/procx/ ./internal/snapshot/ ./internal/config/ ./internal/compare/ \
            ./internal/allowlist/ ./internal/catalog/ ./internal/glob/ ./internal/jsonx/ ./internal/pii/ ./internal/scan/ \
            ./internal/secret/ ./internal/report/ ./internal/baseline/ ./internal/httpx/ ./internal/har/ ./internal/sheet/ ./internal/upload/
          go test -count=1 -run 'TestHelp|TestClassify|TestUsageErrors|TestCompareNamesAreConfiguration|TestImportAndCompare|TestReport|TestHidePrivateValues|TestLockStoreSweep' ./internal/cli/
          go test -count=1 -run 'SQLite|SQLServer' ./internal/appconf/ ./internal/dbdsn/

  # The six platforms, also for pull requests: the package gate
  # below must fail before a merge, not on main or in a release.
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o driftgate-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/driftgate
      # The binary stays as small as it can: its size is reported against the
      # latest release (in the job summary), so every increase is seen and
      # explained in review rather than capped. A package that keeps every
      # method linked (text/template, html/template) or adds debug endpoints
      # (net/http/pprof, expvar) still fails here, not in a release.
      - name: Size
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          file=driftgate-$GOOS-$GOARCH
          size=$(wc -c < "$file")
          base=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets 2>/dev/null \
            | jq -r --arg f "$file" '.tagName + " " + ([.assets[] | select(.name == $f or .name == $f + ".exe") | .size] | first | tostring)' 2>/dev/null || true)
          line="$file: $size bytes"
          if [ -n "$base" ] && [ "${base#* }" != "null" ]; then
            tag=${base% *}; was=${base#* }
            line="$line ($((size - was)) bytes against $tag, $(awk -v a="$size" -v b="$was" 'BEGIN { printf "%+.1f%%", (a / b - 1) * 100 }'))"
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if go list -deps ./cmd/driftgate | grep -Ex 'text/template|html/template|net/http/pprof|expvar|plugin'; then
            exit 1
          fi
          # SQL Server takes SQL logins only: the driver's Kerberos, Azure AD
          # and named-pipe parts, and what they pull in, stay out.
          if go list -deps ./cmd/driftgate | grep -E 'jcmturner|github\.com/Azure/|AzureAD|go-mssqldb/(azuread|integratedauth/krb5|namedpipe)'; then
            exit 1
          fi
